# Local development only: this app's own Postgres. Each app in `apps/*` has its
# own compose.yml; when copying an app, give it a unique `name` and host port.
# 5433 keeps clear of a Planeward checkout on 5432.
name: planeward-app-web

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: planeward_app
      POSTGRES_PASSWORD: planeward_app
      POSTGRES_DB: planeward_app
    ports:
      - "5433:5432"
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/.
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planeward_app -d planeward_app"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
